eading delivery taught me how products ship. I wanted to build them too, with more tools and frameworks in my arsenal and advanced understanding of everything the business needs.<\u002Fspan><\u002Fdiv>\n<div class=\"prd\"><span class=\"pk\">Who it's for:<\u002Fspan> <span class=\"pv\">Teams that need someone who can lead the work and read the code.<\u002Fspan><\u002Fdiv>\n<div class=\"prd\"><span class=\"pk\">Solution:<\u002Fspan> <span class=\"pv\">MBA plus MS in AI. Built a text-to-SQL app, a RAG app, and an agent crew that checks its own math with code.<\u002Fspan><\u002Fdiv>\n<div class=\"prd\"><span class=\"pk\">Non-goals:<\u002Fspan> <span class=\"pv\">Pretending to be a research scientist.<\u002Fspan><\u002Fdiv>\n\n<div class=\"prd\"><span class=\"pk\">Success metric:<\u002Fspan> <span class=\"pv\">Leading a product or data team.<\u002Fspan><\u002Fdiv>\n<div style=\"margin-top: 26px; height: 219px\"><span class=\"pk\" style=\"font-size: calc(30px*var(--sc,1)); display: block; margin-bottom: 10px\">Version history<\u002Fspan>\n\n\n<div class=\"vh\" style=\"height: 52px\"><div class=\"vh\" style=\"height: 41px\"><b>v1.0<\u002Fb> (2016 to 2022): Test engineer to Team Lead, Accenture.<\u002Fdiv><div class=\"vh\"><b>v1.5<\u002Fb> (2023 to 2024): Planned break, financial markets certification, travel.<\u002Fdiv><b>v2.0<\u002Fb> (2024 to 2026): MBA plus MS in Business Analytics and AI.<\u002Fdiv>\n<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<\u002Fsection>\n\n<sc-if value=\"{{showSheet}}\" hint-placeholder-val=\"{{ false }}\">\n<div sc-camel-on-click=\"{{closeSheet}}\" style=\"position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;padding:16px\">\n<div role=\"dialog\" aria-modal=\"true\" aria-label=\"Case study\" sc-camel-on-click=\"{{stop}}\" style=\"background:var(--surface);color:var(--ink);border:1px solid var(--rule);border-radius:8px;max-width:680px;width:100%;max-height:92%;overflow:auto;padding:32px\">\n<p class=\"pl\" style=\"margin-bottom:8px\">{{sheet.tag}}<\u002Fp>\n<h3 class=\"sr\" style=\"font-weight:900;font-size:29px;letter-spacing:-.02em;line-height:1.1\">{{sheet.title}}<\u002Fh3>\n<div style=\"display:flex;flex-wrap:wrap;gap:6px;margin:16px 0\"><sc-for list=\"{{sheet.meta}}\" as=\"m\" hint-placeholder-count=\"4\"><span class=\"pill\">{{m.t}}<\u002Fspan><\u002Fsc-for><\u002Fdiv>\n<p style=\"color:var(--ink);font-style:italic;margin-top:10px;font-size:14.4px;line-height:1.75\">{{sheet.outcome}}<\u002Fp>\n<p style=\"color:var(--mid);margin-top:10px;font-size:14.4px;line-height:1.75;font-weight:300\">{{sheet.desc}}<\u002Fp>\n<sc-if value=\"{{sheet.hasTake}}\" hint-placeholder-val=\"{{ true }}\"><p style=\"margin-top:19px;padding:14px 18px;border-left:3px solid var(--accent);background:var(--al);border-radius:0 6px 6px 0;font-size:14.4px;line-height:1.65;color:var(--ink)\"><b style=\"display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:4px\">What I took from it<\u002Fb>{{sheet.take}}<\u002Fp><\u002Fsc-if>\n<sc-if value=\"{{sheet.hasGap}}\" hint-placeholder-val=\"{{ false }}\"><p style=\"margin-top:14px;font-size:13px;color:var(--muted);line-height:1.6\"><b style=\"font-weight:600;color:var(--mid)\">What's missing:<\u002Fb> {{sheet.gap}}<\u002Fp><\u002Fsc-if>\n<div style=\"display:flex;gap:12px;margin-top:24px;flex-wrap:wrap\">\n<sc-for list=\"{{sheet.links}}\" as=\"lk\" hint-placeholder-count=\"2\"><a class=\"btn bt\" href=\"{{lk.url}}\" target=\"_blank\" style=\"background:var(--accent);color:var(--fi)\">{{lk.label}}<\u002Fa><\u002Fsc-for>\n<button class=\"btn bg\" sc-camel-on-click=\"{{closeSheet}}\" style=\"border:1.5px solid var(--rule);color:var(--mid);background:transparent\">Close<\u002Fbutton>\n<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<\u002Fsc-if>\n\n<section id=\"work\" class=\"panel\" style=\"background:var(--bg);overflow:visible\">\n<p class=\"pl rv\">Background<\u002Fp>\n<h2 class=\"pt rv\">Experience<\u002Fh2>\n<div style=\"max-width:900px;margin:0 auto\">\n<svg sc-camel-view-box=\"0 0 900 70\" role=\"img\" aria-label=\"Route from Mumbai to Dallas to Nashville\" style=\"display:block;width:100%;height:auto\"><path class=\"rpath\" sc-camel-path-length=\"1\" d=\"M80,50 Q450,0 820,50\" fill=\"none\" stroke=\"var(--accent)\" stroke-width=\"2.5\" stroke-linecap=\"round\"><\u002Fpath><circle cx=\"80\" cy=\"50\" r=\"9\" fill=\"var(--accent)\" stroke=\"var(--bg)\" stroke-width=\"3\"><\u002Fcircle><circle cx=\"450\" cy=\"25\" r=\"9\" fill=\"var(--accent)\" stroke=\"var(--bg)\" stroke-width=\"3\"><\u002Fcircle><circle cx=\"820\" cy=\"50\" r=\"9\" fill=\"var(--accent)\" stroke=\"var(--bg)\" stroke-width=\"3\"><\u002Fcircle><\u002Fsvg>\n<div style=\"position:relative;height:64px;margin:6px 0 45px;font-size:13px;color:var(--muted);font-weight:300\">\n<div style=\"position:absolute;top:0;left:8.9%;transform:translateX(-50%);text-align:center;width:28%\"><b class=\"sr\" style=\"display:block;font-weight:700;font-size:16px;color:var(--ink)\">Mumbai<\u002Fb>Accenture, 2016 to 2022<\u002Fdiv>\n<div style=\"position:absolute;top:0;left:50%;transform:translateX(-50%);text-align:center;width:28%\"><b class=\"sr\" style=\"display:block;font-weight:700;font-size:16px;color:var(--ink)\">Dallas<\u002Fb>MBA + MS, UT Dallas<\u002Fdiv>\n<div style=\"position:absolute;top:0;left:91.1%;transform:translateX(-50%);text-align:center;width:28%\"><b class=\"sr\" style=\"display:block;font-weight:700;font-size:16px;color:var(--ink)\">Nashville<\u002Fb>Where I am based now<\u002Fdiv>\n<\u002Fdiv><\u002Fdiv>\n<div style=\"display:grid;gap:40px;padding-bottom:32px\">\n<article class=\"role\" style=\"--i:0\"><div><p style=\"font-size:12px;color:var(--muted)\">Aug 2025 – Dec 2025<\u002Fp><p style=\"font-size:11px;color:var(--muted);font-weight:300\">Richardson, TX<\u002Fp><\u002Fdiv><div><h3 class=\"sr\" style=\"font-weight:700;font-size:20px;margin-bottom:2px\">Teaching Assistant, Marketing<\u002Fh3><p style=\"font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:12px\">University of Texas at Dallas<\u002Fp><p style=\"font-size:14px;color:var(--mid);line-height:1.75;font-style:italic\">Supported course delivery at UT Dallas while completing the MBA + MS program.<\u002Fp><\u002Fdiv><\u002Farticle>\n<article class=\"role\" style=\"--i:1\"><div><p style=\"font-size:12px;color:var(--muted)\">Jan 2022 – Dec 2022<\u002Fp><p style=\"font-size:11px;color:var(--muted);font-weight:300\">Mumbai, India<\u002Fp><\u002Fdiv><div><h3 class=\"sr\" style=\"font-weight:700;font-size:20px;margin-bottom:2px\">Application Team Lead<\u002Fh3><p style=\"font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:12px\">Accenture<\u002Fp><p style=\"font-size:14px;color:var(--mid);line-height:1.75;font-style:italic\">Served as the connective tissue between engineering, business, and leadership, balancing competing priorities and keeping a complex UK retail engagement on track from planning through delivery.<\u002Fp><\u002Fdiv><\u002Farticle>\n<article class=\"role\" style=\"--i:2\"><div><p style=\"font-size:12px;color:var(--muted)\">Nov 2019 – Jan 2022<\u002Fp><p style=\"font-size:11px;color:var(--muted);font-weight:300\">Mumbai, India<\u002Fp><\u002Fdiv><div><h3 class=\"sr\" style=\"font-weight:700;font-size:20px;margin-bottom:2px\">Application Senior Analyst<\u002Fh3><p style=\"font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:12px\">Accenture<\u002Fp><p style=\"font-size:14px;color:var(--mid);line-height:1.75;font-style:italic\">Became a force multiplier, building tools, models, and pipelines that made entire teams faster, while mentoring the next generation of analysts.<\u002Fp><\u002Fdiv><\u002Farticle>\n<article class=\"role\" style=\"--i:3\"><div><p style=\"font-size:12px;color:var(--muted)\">May 2018 – Nov 2019<\u002Fp><p style=\"font-size:11px;color:var(--muted);font-weight:300\">Mumbai, India<\u002Fp><\u002Fdiv><div><h3 class=\"sr\" style=\"font-weight:700;font-size:20px;margin-bottom:2px\">Application Engineer<\u002Fh3><p style=\"font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:12px\">Accenture<\u002Fp><p style=\"font-size:14px;color:var(--mid);line-height:1.75;font-style:italic\">Moved from observing problems to redesigning the systems causing them, earning the credibility to challenge established workflows and drive cross-team adoption.<\u002Fp><\u002Fdiv><\u002Farticle>\n<article class=\"role\" style=\"--i:4\"><div><p style=\"font-size:12px;color:var(--muted)\">Aug 2016 – May 2018<\u002Fp><p style=\"font-size:11px;color:var(--muted);font-weight:300\">Mumbai, India<\u002Fp><\u002Fdiv><div><h3 class=\"sr\" style=\"font-weight:700;font-size:20px;margin-bottom:2px\">Application Test Associate Engineer<\u002Fh3><p style=\"font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:12px\">Accenture<\u002Fp><p style=\"font-size:14px;color:var(--mid);line-height:1.75;font-style:italic\">Where I learned how enterprise systems fail at scale, developing the pattern recognition that shaped every role that followed.<\u002Fp><\u002Fdiv><\u002Farticle>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"skills\" class=\"panel\" style=\"background:var(--surface)\">\n<p class=\"pl rv\">Toolkit<\u002Fp>\n<h2 class=\"pt rv\">Skills<\u002Fh2>\n<div class=\"sg\" style=\"display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px\">\n<div class=\"scol\"><h4 style=\"font-size:11px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:var(--accent);margin-bottom:16px;padding-bottom:10px;border-bottom:1px solid var(--rule)\">Data &amp; Analytics<\u002Fh4><ul><li style=\"font-size:13.3px;color:var(--mid);padding:6px 0;border-bottom:1px solid var(--rule)\">SQL<\u002Fli><li style=\"font-size:13.3px;color:var(--mid);padding:6px 0;border-bottom:1px solid var(--rule)\">Python<\u002Fli><li style=\"font-size:13.3px;color:var(--mid);padding:6px 0;border-bottom:1px solid var(--rule)\">R<\u002Fli><li style=\"font-size:13.3px;color:var(--mid);padding:6px 0;border-bottom:1px solid var(--rule)\">Tableau<\u002Fli><li style=\"font-size:13.3px;color:var(--mid);padding:6px 0;border-bottom:1px solid var(--rule)\">Data Visualization<\u002Fli><\u002Ful><\u002Fdiv>\n<div class=\"scol\"><h4 style=\"font-size:11px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:var(--accent);margin-bottom:16px;padding-bottom:10px;border-bottom:1px solid var(--rule)\">AI &amp; Automation<\u002Fh4><ul><li style=\"font-size:13.3px;color:var(--mid);padding:6px 0;border-bottom:1px solid var(--rule)\">Gemini API / LLMs<\u002Fli><li style=\"font-size:13.3px;color:var(--mid);padding:6px 0;border-bottom:1px solid var(--rule)\">Machine Learning<\u002Fli><li style=\"font-size:13.3px;color:var(--mid);padding:6px 0;border-bottom:1px solid var(--rule)\">Deep Learning<\u002Fli><li style=\"font-size:13.3px;color:var(--mid);padding:6px 0;border-bottom:1px solid var(--rule)\">Prompt Engineering<\u002Fli><li style=\"font-size:13.3px;color:var(--mid);padding:6px 0;border-bottom:1px solid var(--rule)\">Automated Workflows<\u002Fli><\u002Ful><\u002Fdiv>\n<div class=\"scol\"><h4 style=\"font-size:11px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:var(--accent);margin-bottom:16px;padding-bottom:10px;border-bottom:1px solid var(--rule)\">Product &amp; Delivery<\u002Fh4><ul><li style=\"font-size:13.3px;color:var(--mid);padding:6px 0;border-bottom:1px solid var(--rule)\">Digital Product Management<\u002Fli><li style=\"font-size:13.3px;color:var(--mid);padding:6px 0;border-bottom:1px solid var(--rule)\">Agile / Scrum / JIRA<\u002Fli><li style=\"font-size:13.3px;color:var(--mid);padding:6px 0;border-bottom:1px solid var(--rule)\">Requirements Gathering<\u002Fli><li style=\"font-size:13.3px;color:var(--mid);padding:6px 0;border-bottom:1px solid var(--rule)\">Roadmap Planning<\u002Fli><li style=\"font-size:13.3px;color:var(--mid);padding:6px 0;border-bottom:1px solid var(--rule)\">Incident Management<\u002Fli><\u002Ful><\u002Fdiv>\n<div class=\"scol\"><h4 style=\"font-size:11px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:var(--accent);margin-bottom:16px;padding-bottom:10px;border-bottom:1px solid var(--rule)\">Business<\u002Fh4><ul><li style=\"font-size:13.3px;color:var(--mid);padding:6px 0;border-bottom:1px solid var(--rule)\">Data Storytelling<\u002Fli><li style=\"font-size:13.3px;color:var(--mid);padding:6px 0;border-bottom:1px solid var(--rule)\">Financial Acumen<\u002Fli><li style=\"font-size:13.3px;color:var(--mid);padding:6px 0;border-bottom:1px solid var(--rule)\">Strategic Planning<\u002Fli><li style=\"font-size:13.3px;color:var(--mid);padding:6px 0;border-bottom:1px solid var(--rule)\">Market Sizing &amp; Analysis<\u002Fli><li style=\"font-size:13.3px;color:var(--mid);padding:6px 0;border-bottom:1px solid var(--rule)\">Stakeholder Management<\u002Fli><\u002Ful><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"certs\" class=\"panel\" style=\"background:var(--bg)\">\n<p class=\"pl rv\">Credentials<\u002Fp>\n<h2 class=\"pt rv\">Certifications<\u002Fh2>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;max-width:960px\">\n<button class=\"cert\" data-f=\"{{f0}}\" sc-camel-on-click=\"{{flip0}}\"><span class=\"inner\" style=\"display:block\"><span class=\"face\"><span style=\"width:48px;height:48px;background:var(--al);border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--accent)\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\"><path d=\"M2 9l10-5 10 5-10 5z\"><\u002Fpath><path d=\"M6 11v5c3 2.5 9 2.5 12 0v-5\"><\u002Fpath><\u002Fsvg><\u002Fspan><b style=\"font-weight:600;font-size:15px;line-height:1.3\">Graduate Certificate in Applied Machine Learning<\u002Fb><\u002Fspan><span class=\"face back\"><b style=\"font-weight:600;font-size:15px\">University of Texas at Dallas<\u002Fb><small style=\"color:var(--muted);font-size:12.5px\">Issued Jan 2026<\u002Fsmall><\u002Fspan><\u002Fspan><\u002Fbutton>\n<button class=\"cert\" data-f=\"{{f1}}\" sc-camel-on-click=\"{{flip1}}\"><span class=\"inner\" style=\"display:block\"><span class=\"face\"><span style=\"width:48px;height:48px;background:var(--al);border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--accent)\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"9\" r=\"6\"><\u002Fcircle><path d=\"M8.5 14L7 22l5-3 5 3-1.5-8\"><\u002Fpath><\u002Fsvg><\u002Fspan><b style=\"font-weight:600;font-size:15px;line-height:1.3\">Certified Scrum Product Owner (CSPO)<\u002Fb><\u002Fspan><span class=\"face back\"><b style=\"font-weight:600;font-size:15px\">Scrum Alliance<\u002Fb><small style=\"color:var(--muted);font-size:12.5px\">Issued Mar 2026<\u002Fsmall><\u002Fspan><\u002Fspan><\u002Fbutton>\n<button class=\"cert\" data-f=\"{{f2}}\" sc-camel-on-click=\"{{flip2}}\"><span class=\"inner\" style=\"display:block\"><span class=\"face\"><span style=\"width:48px;height:48px;background:var(--al);border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--accent)\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\"><path d=\"M4 20V10M10 20V4M16 20v-8M22 20H2\"><\u002Fpath><\u002Fsvg><\u002Fspan><b style=\"font-weight:600;font-size:15px;line-height:1.3\">Tableau Business Intelligence Analyst Specialization<\u002Fb><\u002Fspan><span class=\"face back\"><b style=\"font-weight:600;font-size:15px\">Tableau<\u002Fb><small style=\"color:var(--muted);font-size:12.5px\">Issued Feb 2026<\u002Fsmall><\u002Fspan><\u002Fspan><\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"contact\" style=\"background:var(--cbg);min-height:700px;padding:128px 8vw 96px;text-align:center;display:flex;flex-direction:column;justify-content:center;align-items:center\">\n<p style=\"font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:20px\" class=\"rv\">Let’s connect<\u002Fp>\n<h2 class=\"sr rv\" style=\"font-weight:900;font-size:clamp(40px,6vw,82px);line-height:1;letter-spacing:-.03em;color:var(--cink);margin-bottom:24px\">Hiring for AI or data<br>product work?<br><em style=\"font-style:italic;font-weight:300;color:var(--accent)\">Let’s talk.<\u002Fem><\u002Fh2>\n<p style=\"font-size:14.7px;color:var(--cm);max-width:440px;line-height:1.8;margin-bottom:40px;font-weight:300\">I graduated in May and I'm ready to start. I have 36 months of F-1 STEM OPT.<\u002Fp>\n<div style=\"display:flex;gap:12px;flex-wrap:wrap;justify-content:center\">\n<a class=\"btn bt\" href=\"mailto:rahulninawe4@gmail.com\" style=\"background:var(--cink);color:var(--cbg)\">Email Me<\u002Fa>\n<a class=\"btn cg\" href=\"https://www.linkedin.com/in/rahulninawe/\" target=\"_blank\" style=\"border:1.5px solid rgba(255,255,255,.2);color:var(--cm);font-weight:500\">LinkedIn<\u002Fa>\n<a class=\"btn cg\" href=\"https://github.com/NinaweRahul\" target=\"_blank\" style=\"border:1.5px solid rgba(255,255,255,.2);color:var(--cm);font-weight:500\">GitHub<\u002Fa>\n<a class=\"btn cg\" href=\"Rahul_Ninawe_Resume.pdf\" style=\"border:1.5px solid rgba(255,255,255,.2);color:var(--cm);font-weight:500\">Resume<\u002Fa>\n<\u002Fdiv>\n<\u002Fsection>\n<footer style=\"background:var(--fbg);padding:24px 8vw;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:12px;color:#8A9A86\"><span>© 2026 Rahul Ninawe<\u002Fspan><span>Built with intention · GitHub Pages<\u002Fspan><\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1360,&quot;height&quot;:5800}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    const s = this.state, theme = s.theme || 'light';\n    const rowsRaw = [\n {\n  \"title\": \"AI & Agents\",\n  \"cards\": [\n   {\n    \"big\": true,\n    \"tag\": \"AI \\u00b7 Agents \\u00b7 Reliability\",\n    \"title\": \"People Analytics Crew: Multi-Agent Orchestration with CrewAI\",\n    \"outcome\": \"I found out the hard way that AI agents can't be trusted to count, then built a way to check their work.\",\n    \"pills\": [\n     \"CrewAI\",\n     \"Python\",\n     \"LLM agents\",\n     \"Verification\"\n    ],\n    \"role\": \"Solo build\",\n    \"desc\": \"I wanted to see if a crew of LLM agents could write an executive summary of workforce data and get the numbers right. They didn't. Reading the raw CSV, the agents covered only 11%, 63% and 39% of employees across three runs, gave different wrong numbers each time, and the AI checker approved all of it. So I moved the counting into Python, and every number then matched an independently computed answer key. In the final design the LLM drafts and code verifies every claim against all 1,470 rows. Failed drafts go back to the writer with the exact problems, and after three failed tries the report is flagged for human review. It uses a public, fictional HR dataset, and I deliberately dropped age, gender and marital status as a data-minimization guardrail.\",\n    \"take\": \"Don't ask a model to verify itself. Let it write, and let code check.\",\n    \"gap\": \"\",\n    \"links\": [\n     [\n      \"Code\",\n      \"https://github.com/NinaweRahul/crewai-people-analytics\"\n     ]\n    ]\n   },\n   {\n    \"big\": true,\n    \"tag\": \"AI \\u00b7 Analytics \\u00b7 Full-stack\",\n    \"title\": \"Sales Analytics: Text-to-SQL with Gemini, FastAPI and PostgreSQL\",\n    \"outcome\": \"Ask a business question, get the SQL, the data and a chart, on 100K real orders.\",\n    \"pills\": [\n     \"Gemini API\",\n     \"FastAPI\",\n     \"React\",\n     \"PostgreSQL\"\n    ],\n    \"role\": \"Solo build\",\n    \"desc\": \"This is the grown-up version of my first NL-to-SQL tool, which only ran from my terminal. I wanted to see what it takes to make \\\"AI writes your SQL\\\" something you'd actually trust, so I put it on the web: React on Vercel, FastAPI on Render, Postgres on Neon. It runs on the Olist e-commerce dataset (about 100K real, anonymized orders), modeled as a proper star schema. The guardrails are the part I'm proudest of: generated SQL is validated before it touches the database, queries run through a read-only role, requests are rate limited, and there's a plan for when the model is down. A schema tab shows the live database diagram.\",\n    \"take\": \"Prompting gets you a demo. Guardrails get you something you could ship.\",\n    \"gap\": \"\",\n    \"links\": [\n     [\n      \"Live demo\",\n      \"https://sales-analytics-webapp.vercel.app\"\n     ],\n     [\n      \"Code\",\n      \"https://github.com/NinaweRahul/sales-analytics-webapp\"\n     ]\n    ]\n   },\n   {\n    \"big\": true,\n    \"tag\": \"AI \\u00b7 RAG \\u00b7 Full-stack\",\n    \"title\": \"Document Intelligence: RAG with FAISS, Gemini and Next.js\",\n    \"outcome\": \"Upload a document, ask it questions, and get answers that stay grounded in what it says.\",\n    \"pills\": [\n     \"Next.js\",\n     \"FastAPI\",\n     \"FAISS\",\n     \"Gemini\"\n    ],\n    \"role\": \"Solo build\",\n    \"desc\": \"This is my RAG chatbot turned into a real web app. A Next.js front end on Vercel talks to a FastAPI backend on Render, and each session gets its own FAISS vector store, so one person's documents never mix with another's. The core idea carried over from the RAG project: a similarity threshold, set by looking at real score distributions, stops the model from answering when the document doesn't actually contain the answer. The design matches this portfolio.\",\n    \"take\": \"Calibrating the threshold on real data beat guessing a number.\",\n    \"gap\": \"No automated tests yet, and no multi-document support.\",\n    \"links\": [\n     [\n      \"Live demo\",\n      \"https://document-intelligence-app-lilac.vercel.app\"\n     ],\n     [\n      \"Code\",\n      \"https://github.com/NinaweRahul/document-intelligence-app\"\n     ]\n    ]\n   }\n  ]\n },\n {\n  \"title\": \"Data & ML\",\n  \"cards\": [\n   {\n    \"big\": true,\n    \"tag\": \"Analytics \\u00b7 Product Data \\u00b7 SQL + ML\",\n    \"title\": \"GTM Ad Analytics: SQL, Random Forest and Tableau\",\n    \"outcome\": \"Where do advertisers drop off, and which ones are worth chasing? Answered across 27K ad events.\",\n    \"pills\": [\n     \"PostgreSQL\",\n     \"Python\",\n     \"scikit-learn\",\n     \"Tableau\"\n    ],\n    \"role\": \"Solo build\",\n    \"desc\": \"I built a full analytics system for a Google Ads-style platform, using simulated data: 1,000 advertiser accounts, 724 campaigns, 27,352 ad events and over $600K in spend. First, funnel diagnostics in SQL and Tableau show where advertisers fall away between signup and running a campaign. Second, a Random Forest predicts 90-day customer value from the first 30 days of behavior, so a sales team could focus on the accounts most worth their time. Third, a churn-risk model, where the small dataset limited what it could learn, and I say so in the write-up.\",\n    \"take\": \"Knowing what the model can't tell you matters as much as what it can.\",\n    \"gap\": \"\",\n    \"links\": [\n     [\n      \"Code\",\n      \"https://github.com/NinaweRahul/gtm-analytics-portfolio\"\n     ]\n    ]\n   },\n   {\n    \"big\": false,\n    \"tag\": \"ML \\u00b7 Predictive Analytics\",\n    \"title\": \"NYC Airbnb Pricing: Regression Modeling with scikit-learn\",\n    \"outcome\": \"A price model across 48,000+ listings, tuned down to an RMSE of 0.40.\",\n    \"pills\": [\n     \"Python\",\n     \"scikit-learn\",\n     \"pandas\",\n     \"Jupyter\"\n    ],\n    \"role\": \"Solo build\",\n    \"desc\": \"I compared Linear Regression, Decision Tree and Random Forest using cross-validation, then tuned the best one with GridSearchCV to reach an RMSE of 0.40 on log-transformed price. The work covers everything from exploring the data to cleaning, picking a model and evaluating it.\",\n    \"take\": \"\",\n    \"gap\": \"\",\n    \"links\": [\n     [\n      \"Code\",\n      \"https://github.com/NinaweRahul/nyc-airbnb-price-predictor\"\n     ]\n    ]\n   },\n   {\n    \"big\": false,\n    \"tag\": \"Strategy \\u00b7 AI Commerce \\u00b7 Case competition\",\n    \"title\": \"Google Agentic Commerce: Go-to-Market Strategy and Metric Design\",\n    \"outcome\": \"A growth plan for Google in AI shopping, built around one question: did the shopper finish what they set out to do?\",\n    \"pills\": [\n     \"Strategy\",\n     \"GTM\",\n     \"Metric design\",\n     \"Team of 5\"\n    ],\n    \"role\": \"Team lead and strategy presenter (Feb to Mar 2026)\",\n    \"desc\": \"Google and USC Marshall co-hosted this case competition, and our task was to plan how Google could lead AI-driven shopping. We introduced Mission Completion Rate (MCR) as the north-star metric, which looks at whether a shopper's whole task succeeded, from intent to recommendation to execution, instead of counting clicks and conversions. Our argument was that Google's real edge over Amazon is orchestrating the whole experience across Search, Gemini, Maps and Android, including after the purchase.\",\n    \"take\": \"The right metric changes what a team builds.\",\n    \"gap\": \"\",\n    \"links\": []\n   }\n  ]\n },\n {\n  \"title\": \"Personal & Creative\",\n  \"cards\": [\n   {\n    \"big\": false,\n    \"tag\": \"Games \\u00b7 Web \\u00b7 Just for fun\",\n    \"title\": \"Fun Games: Real-time Multiplayer in Vanilla JavaScript\",\n    \"outcome\": \"Seven tiny two-player games on one cute page. Play the computer, share a screen, or send a friend a room code.\",\n    \"pills\": [\n     \"JavaScript\",\n     \"Static site\",\n     \"Online multiplayer\"\n    ],\n    \"role\": \"Solo build\",\n    \"desc\": \"I wanted something I could send a friend and have them playing in ten seconds. There are seven games, including Light Cycle Duel, Chain Reaction, Sumo Bump and Frog Pond. Each works three ways: solo against the computer on three difficulty levels, two people on one screen, or online with a five-letter room code. There are no accounts, no backend and no build step, so it runs on a phone as easily as a laptop. The room code starts with a letter that identifies the game, so the front page can send your friend to the right one from the code alone.\",\n    \"take\": \"Cutting accounts and backend was a product decision as much as a technical one. Fewer steps means more people actually play.\",\n    \"gap\": \"\",\n    \"links\": [\n     [\n      \"Code\",\n      \"https://github.com/NinaweRahul/fun-games\"\n     ]\n    ]\n   },\n   {\n    \"big\": false,\n    \"tag\": \"Product \\u00b7 Fintech \\u00b7 Hackathon\",\n    \"title\": \"Clarity Investments: Scenario-Based Advisor in Streamlit\",\n    \"outcome\": \"Investing explained in plain English, so a market drop doesn't turn into panic selling.\",\n    \"pills\": [\n     \"Python\",\n     \"Streamlit\",\n     \"Product thinking\"\n    ],\n    \"role\": \"Built and deployed in a 24-hour hackathon\",\n    \"desc\": \"Built for the Goldman Sachs x UT Dallas hackathon in May 2026. I went after beginner investors who find finance too complicated and tend to sell in a panic when the market drops. Clarity starts with a three-question onboarding, explains market moves in plain language, and lets you try \\\"what if\\\" scenarios like a crash, inflation or a big purchase, each with a clear next step. It's a live Streamlit app, built and deployed in 24 hours. I didn't win. The winning team had a polished interface and real quantitative risk tools like Monte Carlo simulations, and I'd focus on those first next time.\",\n    \"take\": \"Shipping in 24 hours taught me what to cut. Losing taught me which cut was wrong.\",\n    \"gap\": \"\",\n    \"links\": [\n     [\n      \"Live demo\",\n      \"https://clarityinvestments.streamlit.app\"\n     ],\n     [\n      \"Code\",\n      \"https://github.com/NinaweRahul/clarity_investments\"\n     ]\n    ]\n   }\n  ]\n }\n];\n    const all = [];\n    const rows = rowsRaw.map((r) => ({\n      title: r.title,\n      count: r.cards.length,\n      word: r.cards.length === 1 ? 'project' : 'projects',\n      dots: r.cards.map((_, i, arr) => { const m = Math.max(arr.length - 1, 1); return { a: Math.max(0, (i - 1) / m), c: i / m, b: Math.min(1, (i + 1) / m), last: String(i === arr.length - 1) }; }),\n      cards: r.cards.map((c, i) => {\n        const id = r.title + i;\n        const card = Object.assign({}, c, { id, num: '0' + (i + 1), big: String(!!c.big), pills: c.pills.map((t) => ({ t })), open: () => this.setState({ sheet: id }) });\n        all.push(card);\n        return card;\n      }),\n    }));\n    const sc = (e, d) => { const t = e.currentTarget.closest('.prow').querySelector('.track'); t.scrollBy({ left: d * 320, behavior: 'smooth' }); };\n    const cur = all.find((c) => c.id === s.sheet);\n    const sheet = cur ? { tag: cur.tag, title: cur.title, outcome: cur.outcome, desc: cur.desc, take: cur.take, hasTake: !!cur.take, links: cur.links.map((l) => ({ label: l[0], url: l[1] })), meta: [cur.role].concat(cur.pills.map((p) => p.t)).map((t) => ({ t })), gap: cur.gap, hasGap: !!cur.gap } : { tag: '', title: '', outcome: '', desc: '', take: '', hasTake: false, links: [], meta: [], gap: '', hasGap: false };\n    const fl = s.flip || {};\n    const flipper = (i) => () => this.setState({ flip: Object.assign({}, fl, { [i]: !fl[i] }) });\n    return {\n      theme, isDark: theme === 'dark', isLight: theme === 'light',\n      toggle: () => this.setState({ theme: theme === 'light' ? 'dark' : 'light' }),\n      rows, scrollPrev: (e) => sc(e, -1), scrollNext: (e) => sc(e, 1),\n      showSheet: !!cur, sheet, closeSheet: () => this.setState({ sheet: null }), stop: (e) => e.stopPropagation(),\n      f0: String(!!fl[0]), f1: String(!!fl[1]), f2: String(!!fl[2]), flip0: flipper(0), flip1: flipper(1), flip2: flipper(2),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
